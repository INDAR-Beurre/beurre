name: 💡 Feature Request
description: Suggest an idea or enhancement for Beurre
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Beurre even better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the motivation.
      placeholder: "I'm always frustrated when..."
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe what you'd like to happen and how it fits into Beurre's minimalist ergonomics.
      placeholder: "Add support for..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
